name: CI

on:
  push:
    branches: [main, "v2/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra server --extra engine --extra models --extra optional-models --extra cpu
      - run: scripts/check.sh
