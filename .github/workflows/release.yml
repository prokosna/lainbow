name: Release

on:
  push:
    tags: ["v2.*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: prokosna

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute the version from the tag (v2.1.0 -> 2.1.0)
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/lainbow-server:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/lainbow-server:2
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  engine:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        accel: [cpu, cuda, rocm]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute the version from the tag (v2.1.0 -> 2.1.0)
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/engine.Dockerfile
          build-args: ACCEL=${{ matrix.accel }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/lainbow-engine:${{ steps.version.outputs.value }}-${{ matrix.accel }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/lainbow-engine:2-${{ matrix.accel }}
          cache-from: type=gha,scope=engine-${{ matrix.accel }}
          cache-to: type=gha,mode=max,scope=engine-${{ matrix.accel }}
