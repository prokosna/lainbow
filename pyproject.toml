[project]
name = "lainbow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
]

api = [
    "alembic",
    "celery[zstd]",
    "fastapi",
    "httpx",
    "numpy",
    "pika",
    "psycopg[binary]",
    "psycopg2-binary",
    "pydantic",
    "SQLAlchemy",
    "sqlmodel",
    "tenacity",
    "uvicorn[standard]",
    "qdrant-client>=1.16.2",
]

batch = [
    "celery[zstd]",
    "celery-stubs",
    "flower",
    "httpx",
    "librosa",
    "mutagen",
    "numpy",
    "pika",
    "psycopg[binary]",
    "psycopg2-binary",
    "pydantic",
    "SQLAlchemy",
    "sqlmodel",
    "tenacity",
    "qdrant-client>=1.16.2",
]

inference = [
    "celery[zstd]",
    "celery-stubs",
    "fastapi",
    "laion-clap",
    "librosa",
    "muq",
    "nnAudio",
    "numpy",
    "pydantic",
    "python-multipart",
    "transformers",
    "uvicorn[standard]",
]

inference-cpu = [
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchvision==0.24.1",
]

inference-cuda = [
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchvision==0.24.1",
]

inference-rocm = [
    "pytorch-triton-rocm",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchvision==0.24.1",
]

[tool.uv]
conflicts = [[{ group = "inference-cpu" }, { group = "inference-cuda" }, { group = "inference-rocm" }]]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "inference-cpu" },
    { index = "pytorch-cu128", group = "inference-cuda" },
    { index = "pytorch-rocm", group = "inference-rocm" },
]
torchaudio = [
    { index = "pytorch-cpu", group = "inference-cpu" },
    { index = "pytorch-cu128", group = "inference-cuda" },
    { index = "pytorch-rocm", group = "inference-rocm" },
]
torchvision = [
    { index = "pytorch-cpu", group = "inference-cpu" },
    { index = "pytorch-cu128", group = "inference-cuda" },
    { index = "pytorch-rocm", group = "inference-rocm" },
]
pytorch-triton-rocm = [
    { index = "pytorch-rocm", group = "inference-rocm" },
]

[tool.ruff]
src = ["src", "tests"]
extend-exclude = ["alembic"]
line-length = 100
lint.select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
lint.ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not postgres'"
markers = [
    "postgres: needs a running PostgreSQL (run with -m postgres)",
]

[tool.mypy]
mypy_path = "src"
ignore_missing_imports = true
strict = true
warn_unreachable = true
