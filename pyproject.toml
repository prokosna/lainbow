[project]
name = "lainbow"
version = "2.0.0.dev0"
description = "Music analysis engine: similar-song and natural-language search for a local music library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
]

[project.optional-dependencies]
server = [
    "alembic>=1.16",
    "fastapi>=0.120",
    "mutagen>=1.47",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.38",
]
engine = [
    "httpx>=0.28",
]

[project.scripts]
lainbow-server = "lainbow.server.__main__:main"
lainbow-engine = "lainbow.engine.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "import-linter>=2.5",
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not postgres'"
markers = [
    "postgres: needs a disposable PostgreSQL with pgvector (set LAINBOW_TEST_DATABASE_URL)",
]

[tool.mypy]
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.importlinter]
root_package = "lainbow"

[[tool.importlinter.contracts]]
name = "core depends on no other lainbow package"
type = "forbidden"
source_modules = ["lainbow.core"]
forbidden_modules = ["lainbow.server", "lainbow.db", "lainbow.engine"]

[[tool.importlinter.contracts]]
name = "server and db never import the engine"
type = "forbidden"
source_modules = ["lainbow.server", "lainbow.db"]
forbidden_modules = ["lainbow.engine"]

[[tool.importlinter.contracts]]
name = "engine talks to the server over HTTP only"
type = "forbidden"
source_modules = ["lainbow.engine"]
forbidden_modules = ["lainbow.server", "lainbow.db"]

[[tool.importlinter.contracts]]
name = "db does not depend on the server"
type = "forbidden"
source_modules = ["lainbow.db"]
forbidden_modules = ["lainbow.server"]
