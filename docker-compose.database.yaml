services:
  postgres:
    image: postgres:17.5-alpine
    container_name: lainbow_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lainbow_db
    ports:
      - ${POSTGRES_PORT:-5433}:5432
    volumes:
      - type: bind
        source: ${DATABASE_DATA_ROOT_DIR:-.}/postgres_data
        target: /var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4.1.2-management
    container_name: lainbow_rabbitmq
    ports:
      - ${RABBITMQ_PORT:-5672}:5672
      - ${RABBITMQ_MANAGEMENT_PORT:-15672}:15672
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password
    volumes:
      - type: bind
        source: ${DATABASE_DATA_ROOT_DIR:-.}/rabbitmq_data
        target: /var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.16
    container_name: lainbow_qdrant
    ports:
      - ${QDRANT_PORT_HTTP:-6333}:6333
      - ${QDRANT_PORT_GRPC:-6334}:6334
    volumes:
      - type: bind
        source: ${DATABASE_DATA_ROOT_DIR:-.}/qdrant_data
        target: /qdrant/storage
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3",
        ]
      interval: 30s
      start_period: 60s
      timeout: 20s
      retries: 3
