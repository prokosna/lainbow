# Lainbow 2. Run it from a checkout of a release tag; settings come from the .env next to this file.
# Images are built locally. The first start is `docker compose up -d --build`; after that `up -d` and `down` are enough.
name: ${LAINBOW_PROJECT_NAME:-lainbow}

# Settings shared by the three engine variants; exactly one runs, chosen by COMPOSE_PROFILES.
x-engine: &engine
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &engine-env
    # Container paths and URLs are fixed here and override anything in .env.
    LAINBOW_MUSIC_DIR: /music
    LAINBOW_MODELS_DIR: /models
    LAINBOW_SERVER_URL: http://server:8000
    LAINBOW_TOKEN: ${ENGINE_TOKEN:?set ENGINE_TOKEN in .env}
  volumes:
    # Model weights are downloaded here once and reused across restarts.
    - ${DATA_DIR:-./data}/models:/models
    # Read-only: the engine reads local files instead of downloading them from the server.
    - ${MUSIC_DIR:?set MUSIC_DIR in .env}:/music:ro
  depends_on:
    server:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: lainbow
      POSTGRES_DB: lainbow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # The only state of Lainbow. Not published on the host.
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lainbow -d lainbow"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    image: lainbow-server:${LAINBOW_VERSION:-local}
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Container paths and URLs are fixed here and override anything in .env.
      LAINBOW_MUSIC_DIR: /music
      LAINBOW_DATABASE_URL: postgresql+psycopg://lainbow:${POSTGRES_PASSWORD}@postgres:5432/lainbow
      # Registers the bundled engine, so no manual `add-engine` step is needed.
      LAINBOW_LOCAL_ENGINE_TOKEN: ${ENGINE_TOKEN:?set ENGINE_TOKEN in .env}
    ports:
      # All interfaces on purpose: Sola MPD connects from other hosts.
      - "${PORT:-8000}:8000"
    volumes:
      # Read-only: Lainbow only reads tags and file lists.
      - ${MUSIC_DIR:?set MUSIC_DIR in .env}:/music:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  engine-cpu:
    <<: *engine
    profiles: [cpu]
    image: lainbow-engine:${LAINBOW_VERSION:-local}-cpu
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
      args:
        ACCEL: cpu
    networks:
      default:
        aliases: [engine] # the server reaches the engine as http://engine:8001

  engine-cuda:
    <<: *engine
    profiles: [cuda]
    image: lainbow-engine:${LAINBOW_VERSION:-local}-cuda
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
      args:
        ACCEL: cuda
    networks:
      default:
        aliases: [engine]
    deploy:
      resources:
        reservations:
          devices:
            # Needs the NVIDIA Container Toolkit on the host.
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  engine-rocm:
    <<: *engine
    profiles: [rocm]
    image: lainbow-engine:${LAINBOW_VERSION:-local}-rocm
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
      args:
        ACCEL: rocm
    networks:
      default:
        aliases: [engine]
    devices:
      - /dev/kfd
      - /dev/dri
    # Numeric GID of the host's render/video group also works.
    group_add:
      - ${GPU_GID:-video}
    environment:
      <<: *engine-env
      # Only for GPUs ROCm does not support officially. No value here: it is passed through from .env
      # when set there, and stays unset in the container otherwise.
      HSA_OVERRIDE_GFX_VERSION:
      MIOPEN_FIND_MODE: FAST # skip the slow kernel search at start
      MIOPEN_USER_DB_PATH: /models/miopen # keep the kernel cache across restarts
